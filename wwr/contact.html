<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Contact Exciting Expeditions for rafting reservations, questions, or website suggestions. We're here to help!">
    <meta name="author" content="Alex Condori">
    <title>Contact Us - Exciting Expeditions</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="images/logo.svg" alt="Exciting Expeditions Logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>Contact Us - Exciting Expeditions</h1>
            <p><strong>Address:</strong> 123 Main River Street, Kolob, California</p>
            <p><strong>Phone:</strong> +1 999 999 9999</p>
            <p><strong>Email:</strong> <a href="mailto:info@whitewater.com">info@whitewater.com</a></p>
        </section>

        <section class="contact-info">
            <div class="map">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.0977691765745!2d-122.4194!3d37.7749!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzfCsDQ2JzI5LjgiTiAxMjLCsDI1JzEwLjAiVw!5e0!3m2!1sen!2sus!4v1234567890"
                    width="600" height="450" allowfullscreen="" loading="lazy"></iframe>
            </div>
            <form action="#" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>Purpose of Message:</legend>
                    <label><input type="radio" name="purpose" value="general" required> General Inquiry</label>
                    <label><input type="radio" name="purpose" value="reservation"> Reservation Question</label>
                    <label><input type="radio" name="purpose" value="suggestion"> Website Suggestion</label>
                </fieldset>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="1" required></textarea>

                <label>
                    <input type="checkbox" name="newsletter"> Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>
            </form>
        </section>

        <section class="employee-profiles">
            <h2>Meet Our Team</h2>
            <div class="employees">
                <figure>
                    <img src="images/employee1.jpg" alt="John Doe">
                    <figcaption>John Doe - Head Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Jane Smith">
                    <figcaption>Jane Smith - Safety Coordinator</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Carlos Ruiz">
                    <figcaption>Carlos Ruiz - Trip Planner</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2025 | Exciting Expeditions | Alex Condori</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://whatsapp.com/">
                <img src="images/whatsapp.svg" alt="Whatsapp Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
